<!DOCTYPE html>
<html>
<head>
    <title>My Cart - FoodieFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2 class="mb-4">
    🛒 My Cart
</h2>

{% if items %}

<table class="table table-bordered table-striped">

    <thead class="table-dark">
        <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>

        {% for i in items %}
        <tr>

            <td>
                {{ i.item.name }}
            </td>

            <td>
                ₹ {{ i.item.price }}
            </td>

            <td>
                {{ i.quantity }}
            </td>

            <td>
                ₹ {{ i.item.price }} × {{ i.quantity }}
            </td>

            <td>
                <a
                    href="{% url 'remove_from_cart' i.item.id %}"
                    class="btn btn-danger btn-sm"
                >
                    Remove
                </a>
            </td>

        </tr>
        {% endfor %}

    </tbody>

</table>

<h4 class="mt-3">
    Total: ₹ {{ total }}
</h4>

<a
    href="{% url 'checkout' %}"
    class="btn btn-success mt-3"
>
    💳 Checkout
</a>

{% else %}

<p>
    Your cart is empty 🛒
</p>

{% endif %}

<a
    href="/"
    class="btn btn-primary mt-3"
>
    Continue Shopping
</a>

</body>
</html>
