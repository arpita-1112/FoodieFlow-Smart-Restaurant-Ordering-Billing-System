<!DOCTYPE html>
<html>
<head>
    <title>Payment - FoodieFlow</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5 text-center">

    <h2 class="mb-4">💳 Payment Gateway</h2>

    <p>Select Payment Method:</p>

    <button class="btn btn-success m-2" onclick="pay('UPI')">UPI</button>
    <button class="btn btn-primary m-2" onclick="pay('Card')">Card</button>
    <button class="btn btn-warning m-2" onclick="pay('Cash')">Cash</button>

    <h4 id="msg" class="mt-4"></h4>

    <div class="mt-4">
        <a href="/" class="btn btn-light">🏠 Back to Home</a>
    </div>

</div>

<script>

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function pay(method){

    document.getElementById("msg").innerText =
        "Processing " + method + "...";

    fetch("/payment-success/", {
        method: "POST",
        headers: {
            "X-CSRFToken": getCookie("csrftoken"),
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            method: method
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "ok") {

            document.getElementById("msg").innerText =
                "Payment Successful 🎉";

            setTimeout(() => {
                window.location.href = "/success/";
            }, 1200);

        } else {
            document.getElementById("msg").innerText =
                data.msg || "Payment Failed";
        }

    })
    .catch(() => {
        document.getElementById("msg").innerText =
            "Server Error in Payment";
    });

}

</script>

</body>
</html>
