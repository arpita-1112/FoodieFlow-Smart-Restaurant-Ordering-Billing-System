<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>
    <style>
        body {
            background: #0f2027;
            color: white;
            text-align: center;
            padding-top: 100px;
            font-family: Arial;
        }

        .box {
            animation: pop 0.8s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .check {
            font-size: 80px;
            color: lime;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="check">✔</div>
    <h1>Order Placed Successfully!</h1>
    <p>Your delicious food is on the way 🚀</p>

    <a href="/" style="color:yellow;">Go Home</a>
</div>

</body>
</html>
